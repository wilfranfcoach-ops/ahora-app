<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#A8FF53">
<title>AHORA - Presencia Real</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', sans-serif; background:#0a0a0a; color:white;}
  .glass{background:rgba(30,30,30,0.9); backdrop-filter:blur(20px);}
</style>
</head>
<body class="min-h-screen pb-24">
<div id="app"></div>
<script>
const frases = [
  "El presente es el único lugar donde la vida sucede",
  "Ayer es historia, mañana es misterio, hoy es un regalo",
  "Donde están tus pies, está tu vida",
  "Respira, estás aquí. Dios te dio el hoy",
  "El ahora es todo lo que tienes",
  "No busques más, ya llegaste"
];
let history = JSON.parse(localStorage.getItem('ahora_history')||'[]');
let evasion = parseInt(localStorage.getItem('ahora_evasion')||'74');
let view = 'inicio';
let fraseIdx = Math.floor(Math.random()*frases.length);
let notifEnabled = localStorage.getItem('ahora_notif')==='1';

function save(){ localStorage.setItem('ahora_history', JSON.stringify(history)); localStorage.setItem('ahora_evasion', evasion); }

function getCounts(){
  const c = {pasado:0, presente:0, futuro:0};
  history.forEach(h=>c[h.estado]++);
  return c;
}

function render(){
  const counts = getCounts();
  const total = history.length || 1;
  const pPas = Math.round(counts.pasado/total*100);
  const pPre = Math.round(counts.presente/total*100);
  const pFut = Math.round(counts.futuro/total*100);
  const finalPre = history.length ? Math.round(pPre*0.7 + (100-evasion)*0.3) : 22;
  const now = new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});

  let html = `
  <header class="flex justify-between items-center p-4 pt-12">
    <div class="flex gap-3 items-center">
      <span class="text-xs text-zinc-300">${now}</span>
      <h1 class="font-black tracking-widest text-lg">AHORA</h1>
    </div>
    <div class="flex gap-2">
      <button onclick="openManual()" class="w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center text-sm">?</button>
      <button onclick="reset()" class="text-xs bg-zinc-800 px-3 py-1 rounded-full text-zinc-200">Empezar de 0</button>
    </div>
  </header>
  `;

  if(view==='inicio'){
    html += `
    <div class="px-4 space-y-6">
      <button onclick="openManual()" class="text-xs text-zinc-300 underline">¿Cómo funciona AHORA? → Manual 60s</button>
      
      <div class="bg-[#1e1e1e] rounded-[24px] p-5">
        <h2 class="text-sm font-bold text-zinc-200 mb-3">1. Lo que tú dices</h2>
        ${history.length===0 ? '<p class="text-sm text-zinc-300">Aún no has registrado hoy. Dale a Registrar para empezar.</p>' : `
        <div class="flex items-center gap-4">
          <div style="width:90px;height:90px;border-radius:50%;background:conic-gradient(#A8FF53 0% ${pPre}%, #60a5fa ${pPre}% ${pPre+pPas}%, #f87171 ${pPre+pPas}% 100%)"></div>
          <div class="text-xs space-y-1">
            <div class="flex gap-2"><span class="w-2 h-2 bg-green-400 rounded-full mt-1"></span>Presente ${pPre}%</div>
            <div class="flex gap-2"><span class="w-2 h-2 bg-blue-400 rounded-full mt-1"></span>Pasado ${pPas}%</div>
            <div class="flex gap-2"><span class="w-2 h-2 bg-red-400 rounded-full mt-1"></span>Futuro ${pFut}%</div>
            <p class="text-zinc-300 mt-2">Basado en ${history.length} registros tuyos hoy</p>
          </div>
        </div>
        <div class="mt-4 space-y-1 max-h-24 overflow-auto">
          ${history.slice(-5).reverse().map(h=>`<div class="text-xs text-zinc-200 flex gap-2"><span class="w-1.5 h-1.5 rounded-full mt-1 ${h.estado==='presente'?'bg-green-400':h.estado==='pasado'?'bg-blue-400':'bg-red-400'}"></span>${h.time} - ${h.estado}</div>`).join('')}
        </div>`}
      </div>

      <div class="bg-[#1e1e1e] rounded-[24px] p-5">
        <h2 class="text-sm font-bold text-zinc-200">2. Lo que tu celular detecta (Pasivo)</h2>
        <p class="text-xs text-zinc-300 mt-1">Se recoge una vez instalada la app, con tu permiso. Todo local.</p>
        <div class="mt-4 bg-zinc-900 rounded-xl p-4">
          <div class="flex justify-between text-sm"><span class="text-zinc-200">Scroll Compulsivo → Evasión</span><span class="font-bold">${evasion}%</span></div>
          <div class="w-full h-2 bg-zinc-800 rounded-full mt-2"><div class="h-2 bg-orange-400 rounded-full" style="width:${evasion}%"></div></div>
          <p class="text-xs text-zinc-300 mt-2">Cambiaste de app 47 veces en 2h. Cuando hacemos scroll sin parar, estamos evitando sentir el presente. Es tu señal de evasión.</p>
          <div class="flex gap-1 mt-3 h-8 items-end">
            ${[20,50,74,60,30,80,40,25].map(v=>`<div class="flex-1 bg-orange-400/60 rounded-sm" style="height:${v}%"></div>`).join('')}
          </div>
          <p class="text-[10px] text-zinc-400 mt-1">9am - 9pm volatilidad pasiva hoy</p>
        </div>
      </div>

      <div class="rounded-[28px] p-6 text-center border ${finalPre<40?'bg-red-950/30 border-red-800/50':'finalPre<70?bg-yellow-950/30 border-yellow-800/50':'bg-green-950/30 border-green-800/50'}">
        <p class="text-xs tracking-widest text-zinc-300">RESULTADO DEFINITIVO DE HOY</p>
        <p class="text-5xl font-black mt-3">${finalPre}%</p>
        <p class="text-lg font-bold">en el Presente</p>
        <p class="text-sm text-zinc-200 mt-2">${finalPre<40?'Estás poco presente hoy. Tu mente está en otro lado.':finalPre<70?'Vas volviendo al ahora, poco a poco.':'Estás habitando el regalo.'}</p>
        <p class="text-sm italic text-zinc-300 mt-4">"${frases[fraseIdx]}"</p>
        <button onclick="fraseIdx=(fraseIdx+1)%${frases.length};render()" class="text-xs text-zinc-300 underline mt-2">Otra frase →</button>
        <p class="text-xs text-zinc-300 mt-3">Fórmula: 70% lo que tú dices + 30% lo que tu celular detecta</p>
        <button onclick="view='volver';render()" class="w-full mt-5 bg-[#A8FF53] text-black font-bold py-4 rounded-full">VOLVER AL AHORA →</button>
        <p class="text-xs text-zinc-400 mt-2">Te recomendamos 60 seg de anclaje, porque el presente es un regalo</p>
      </div>

      <div class="bg-[#1e1e1e] rounded-[24px] p-4 flex justify-between items-center">
        <div><p class="text-sm font-bold">Recordatorio cada 3h</p><p class="text-xs text-zinc-300">Te avisamos suavemente para registrar</p></div>
        <button onclick="toggleNotif()" class="w-12 h-6 rounded-full ${notifEnabled?'bg-[#A8FF53]':'bg-zinc-700'} relative transition"><div class="w-5 h-5 bg-white rounded-full absolute top-0.5 ${notifEnabled?'right-0.5':'left-0.5'} transition"></div></button>
      </div>
      ${notifEnabled?'<p class="text-xs text-zinc-300 text-center">✅ Notificaciones activas. Próximo: en 3h. Si no llegan, revisa permisos del navegador.</p>':''}
    </div>`;
  } else if(view==='registrar'){
    html += `
    <div class="px-6 pt-10 text-center">
      <h2 class="text-2xl font-bold">¿Dónde está tu mente ahora mismo?</h2>
      <p class="text-sm text-zinc-300 mt-2">Un toque honesto. Sin juzgarte.</p>
      <div class="mt-10 space-y-4">
        <button onclick="add('pasado')" class="w-full py-6 rounded-[20px] bg-blue-500/20 border border-blue-500/30 font-bold">🔵 PASADO <span class="text-xs block text-zinc-300 font-normal">Culpa, rencor, nostalgia</span></button>
        <button onclick="add('presente')" class="w-full py-8 rounded-[20px] bg-[#A8FF53] text-black font-black text-lg shadow-[0_0_30px_rgba(168,255,83,0.4)]">🟢 PRESENTE <span class="text-xs block font-normal">Aquí, ahora, regalo</span></button>
        <button onclick="add('futuro')" class="w-full py-6 rounded-[20px] bg-red-500/20 border border-red-500/30 font-bold">🔴 FUTURO <span class="text-xs block text-zinc-300 font-normal">Ansiedad, preocupación</span></button>
      </div>
      <p class="text-xs text-zinc-300 mt-6">Tu % se calcula: (veces en Presente / total registros) x 100. Más registros = más certero.</p>
    </div>`;
  } else if(view==='volver'){
    html += `
    <div class="px-6 pt-10 text-center">
      <h2 class="text-xl font-bold">Volver al ahora - 60 seg</h2>
      <p class="text-sm text-zinc-300 mt-1">No te sermoneamos. Te anclamos.</p>
      <div id="breath" class="mx-auto mt-10 w-48 h-48 rounded-full bg-[#A8FF53]/30 border border-[#A8FF53] flex items-center justify-center transition-all duration-1000">Inhala</div>
      <p id="phase" class="mt-4 text-sm text-zinc-200">Presiona Iniciar</p>
      <button id="bBtn" onclick="toggleBreath()" class="mt-6 bg-white text-black px-8 py-3 rounded-full font-bold">Iniciar respiración</button>
      <div class="mt-8 bg-zinc-900 rounded-xl p-4 text-left">
        <p class="text-sm font-bold">Anclaje 3-2-1</p>
        <p class="text-xs text-zinc-300 mt-1">Mientras respiras di mentalmente:<br>3 cosas que ves, 2 que tocas, 1 que hueles.</p>
        <p class="text-xs text-zinc-300 mt-2">Voz: Normal (medimos ritmo solo aquí)</p>
      </div>
      <button onclick="add('presente');view='inicio';render()" class="w-full mt-6 bg-[#A8FF53] text-black py-4 rounded-full font-bold">Me siento más presente →</button>
    </div>`;
  }

  html += `
  <nav class="fixed bottom-4 left-4 right-4 bg-[#1e1e1e] rounded-full flex justify-around p-2 border border-zinc-800">
    <button onclick="view='inicio';render()" class="px-6 py-2 rounded-full ${view==='inicio'?'bg-white text-black font-bold':''}">Inicio</button>
    <button onclick="view='registrar';render()" class="px-6 py-2 rounded-full ${view==='registrar'?'bg-white text-black font-bold':''}">Registrar</button>
    <button onclick="view='volver';render()" class="px-6 py-2 rounded-full ${view==='volver'?'bg-white text-black font-bold':''}">Volver</button>
  </nav>

  <div id="manual" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50" onclick="if(event.target.id==='manual')closeManual()">
    <div class="bg-[#1e1e1e] rounded-[24px] p-6 max-w-sm w-full max-h-[80vh] overflow-auto">
      <div class="flex justify-between"><h2 class="font-bold">Cómo funciona AHORA - Manual 60s</h2><button onclick="closeManual()">✕</button></div>
      <div class="text-sm space-y-3 mt-4 text-zinc-200">
        <p><b>No es otra app de meditación. Es un espejo de tu atención.</b></p>
        <p><b>1. Registra:</b> Cada 3h te preguntamos ¿Dónde está tu mente? Pasado (culpa), Presente (regalo), Futuro (ansiedad). Un toque.</p>
        <p><b>2. Tu celular detecta:</b> Sin que hagas nada, contamos cambios de app (scroll). Si saltas mucho = evasión. 100% local, nada a la nube.</p>
        <p><b>3. Resultado definitivo:</b> Mezclamos 70% lo que tú dices + 30% lo que tu celular ve = Tu % real en el presente. Arriba detalle, abajo verdad grande.</p>
        <p><b>4. Volver:</b> Si estás <40% no te sermoneamos. Te anclamos: 60 seg respirando + 3 cosas que ves, 2 que tocas, 1 que hueles.</p>
        <p><b>Privado:</b> Todo queda en tu celular. Puedes borrar con Empezar de 0.</p>
      </div>
      <button onclick="closeManual()" class="w-full mt-6 bg-[#A8FF53] text-black py-3 rounded-full font-bold">Entendido</button>
    </div>
  </div>`;

  document.getElementById('app').innerHTML = html;
  if(view==='volver' && window.breathing) startBreathLoop();
}

function add(estado){
  const time = new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
  history.push({estado,time,ts:Date.now()});
  save();
  view='inicio';
  render();
  if('vibrate' in navigator) navigator.vibrate(50);
}
function reset(){ if(confirm('¿Borrar todo y empezar de 0?')){ history=[]; save(); render(); } }
function openManual(){ document.getElementById('manual').classList.remove('hidden'); document.getElementById('manual').classList.add('flex'); }
function closeManual(){ document.getElementById('manual').classList.add('hidden'); }

let breathing=false, breathInt=null, phase=0;
function toggleBreath(){
  breathing=!breathing;
  const btn=document.getElementById('bBtn');
  if(breathing){ btn.innerText='Detener'; startBreathLoop(); } else { btn.innerText='Iniciar respiración'; clearInterval(breathInt); }
}
function startBreathLoop(){
  const el=document.getElementById('breath'), ph=document.getElementById('phase');
  if(!el) return;
  const phases=['Inhala 4s','Sostén 2s','Exhala 4s'];
  let idx=0;
  clearInterval(breathInt);
  breathInt=setInterval(()=>{
    idx=(idx+1)%3;
    el.innerText=phases[idx];
    ph.innerText=phases[idx];
    el.style.transform= idx===0?'scale(1.4)': idx===1?'scale(1.4)':'scale(1)';
  },2000);
}
function toggleNotif(){
  if(!notifEnabled){
    if('Notification' in window){
      Notification.requestPermission().then(p=>{
        if(p==='granted'){ notifEnabled=true; localStorage.setItem('ahora_notif','1'); schedule(); render(); }
        else alert('Activa notificaciones en ajustes del navegador');
      });
    } else { notifEnabled=true; localStorage.setItem('ahora_notif','1'); render(); }
  } else { notifEnabled=false; localStorage.setItem('ahora_notif','0'); render(); }
}
function schedule(){
  if(!notifEnabled) return;
  setTimeout(()=>{
    if(Notification.permission==='granted'){
      new Notification('AHORA', {body:'¿Dónde está tu mente ahora mismo?', icon:'icon-192.png'});
    }
    schedule();
  }, 3*60*60*1000);
}
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }

render();
</script>
</body>
</html>
